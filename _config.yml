#-------------------------------
# General Site Settings
url: "https://nota.yeste.studio"
#-------------------------------

# Shared theme — see https://github.com/javier-sy/yeste-studio-theme
remote_theme: javier-sy/yeste-studio-theme@main

# Build Settings
markdown: kramdown
permalink: /:title
plugins:
  - jekyll-sitemap
  - jekyll-remote-theme

# Pages Path
defaults:
  - scope:
      path: '_pages'
    values:
      permalink: /:basename:output_ext
      lang: es    # the legal pages are in Spanish

include:
  - _pages

# The home page is assembled from _sections by the theme's product layout (docs/product-sites.md)
collections:
  sections:
    output: false

# Code blocks in Markdown come out as plain <pre><code>, as the page always had them;
# {% highlight %} still colours code.
kramdown:
  syntax_highlighter_opts:
    disable: true

exclude:
  - .idea/
  - Gemfile.lock
  - node_modules/
  - vendor/

sass:
  style: compressed
  silence_deprecations:
    - import
